[project]
name = "calcco-mcp"
version = "0.1.0"
description = "FastMCP server exposing CalcCo's calculator API as MCP tools, with the Engram SDK mounted for shared agent memory."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "engram-mcp-sdk",
    "httpx>=0.27",
]

[tool.uv.sources]
engram-mcp-sdk = { git = "https://github.com/EthanKim8683/engram-mcp-sdk", rev = "main" }
